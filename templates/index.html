{% extends "base.html" %}

{% block title %}My 1st WEB - Home Page{% endblock %}

<body>

    {% block main %}
        <section>
            <h2>Weekly Work</h2>
            <ul>
                {% for item in weekly_work %}
                    <li><a href="{{ item.url }}">Week {{ item.week }} — {{ item.title }}</a></li>
                {% else %}
                    <li>Week 1 — live site launched.</li>
                {% endfor %}
            </ul>
        </section>
    {% endblock %}
       
</body>

</html>
